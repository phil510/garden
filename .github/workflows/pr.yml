name: PR validation

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build app packages
        run: pnpm -r build

      - run: pnpm validate

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux

      # DEBUG: temporary instrumentation for the fake-claude /end timeout investigation
      # (garden #38) — prints the CI tmux version unconditionally so it's in every job log.
      # Revert once the timeout is understood.
      - name: DEBUG - tmux version
        run: tmux -V

      - run: pnpm install --frozen-lockfile

      - run: pnpm test:integration
